server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # A API só recebe JSON (não há upload de arquivos): um limite baixo recusa
    # corpos gigantes antes de chegarem ao PHP.
    client_max_body_size 1M;

    # Resolve "app" pelo DNS interno do Docker a cada 10s em vez de apenas na
    # inicialização: sem isso, recriar o container app (novo IP) derruba o nginx em 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
