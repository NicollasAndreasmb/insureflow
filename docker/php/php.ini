date.timezone = America/Sao_Paulo
memory_limit = 512M
; Sem funcionalidade de upload: arquivos são recusados e o corpo é limitado
; ao mesmo 1M do nginx.
file_uploads = Off
upload_max_filesize = 1M
post_max_size = 1M
expose_php = Off

; O código muda via bind mount, então o opcache precisa revalidar os arquivos,
; mas não a cada requisição: no Docker Desktop (Windows/macOS) cada verificação
; atravessa o bind mount e multiplicava a latência. Revalidar a cada 2s mantém
; as edições visíveis quase de imediato com uma fração do custo.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096K
realpath_cache_ttl = 600
