date.timezone = America/Sao_Paulo
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
expose_php = Off

; Em desenvolvimento o código muda a todo instante via bind mount, então o
; opcache precisa revalidar os arquivos a cada requisição.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
