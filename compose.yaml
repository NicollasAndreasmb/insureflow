# Ambiente de desenvolvimento do InsureFlow.
#
#   web        nginx: único ponto de entrada HTTP (http://localhost:8000)
#   app        PHP-FPM: executa o Laravel (API + view que carrega a SPA)
#   scheduler  mesma imagem do app, rodando o agendador do Laravel
#   postgres   banco de dados (dev + banco de testes criado no init)
#   node       servidor Vite com HMR para o frontend Vue (http://localhost:5173)
#
# Todas as credenciais vêm do arquivo .env (copiado de .env.example), que o
# Compose lê automaticamente para interpolar as variáveis abaixo.

x-php: &php
    build:
        context: ./docker/php
        args:
            UID: ${HOST_UID:-1000}
            GID: ${HOST_GID:-1000}
    image: insureflow-php:dev
    volumes:
        - ./:/var/www/html
    depends_on:
        postgres:
            condition: service_healthy
    restart: unless-stopped

services:
    app:
        <<: *php

    scheduler:
        <<: *php
        command: ["php", "artisan", "schedule:work"]

    web:
        image: nginx:1.27-alpine
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        restart: unless-stopped

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-insureflow}
            POSTGRES_USER: ${DB_USERNAME:-insureflow}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
        ports:
            - "${FORWARD_DB_PORT:-5433}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/create-test-database.sh:/docker-entrypoint-initdb.d/10-create-test-database.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    node:
        build:
            context: ./docker/node
        image: insureflow-node:dev
        command: ["sh", "-c", "npm install && npm run dev"]
        environment:
            VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
            VITE_PORT: ${VITE_PORT:-5173}
        ports:
            - "${VITE_PORT:-5173}:5173"
        volumes:
            - ./:/var/www/html
            - node-modules:/var/www/html/node_modules
        restart: unless-stopped

volumes:
    postgres-data:
    node-modules:
